    <path d="M56 22v40" stroke="#F7F1E3" stroke-width="12" stroke-linecap="round"/>
    <path d="M36 46l20 22 20-22" fill="none" stroke="#F7F1E3" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M32 84h48" stroke="#1D1B18" stroke-width="10" stroke-linecap="round"/>
    <path d="M32 84h48" stroke="#F7F1E3" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 8"/>
  </g>
  <text x="240" y="150" font-family="'JetBrains Mono', monospace" font-size="30" font-weight="500" letter-spacing="6" fill="#1D1B18" opacity="0.65">INSTAGRAM DOWNLOADER</text>
  <text x="236" y="166" font-family="monospace" font-size="4" opacity="0">.</text>

  <!-- headline -->
  <text x="96" y="330" font-family="'Bricolage Grotesque', 'Plus Jakarta Sans', sans-serif" font-size="92" font-weight="700" fill="#1D1B18">KlipGram</text>
  <text x="96" y="424" font-family="'Bricolage Grotesque', 'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="600" fill="#E84A36">Unduh Foto, Video, Reels, Story</text>
  <text x="96" y="484" font-family="'Bricolage Grotesque', 'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="600" fill="#E84A36">&amp; Ekstrak Audio MP3</text>

  <!-- tag chips -->
  <g font-family="'JetBrains Mono', monospace" font-size="24" font-weight="500">
    <rect x="96" y="524" width="150" height="52" rx="26" fill="#1D1B18"/>
