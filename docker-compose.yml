# KlipGram — Dokploy Compose stack.
# In Dokploy: create a "Docker Compose" service pointing at this repo and set
# the compose file to docker-compose.yml. Domains/env are configured in the UI.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: klipgram:latest
    restart: unless-stopped
    ports:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      # Optional runtime settings — set real values in Dokploy's Environment tab
      # (or via env_file) rather than committing secrets here.
      APP_URL: ${APP_URL:-http://localhost:3000}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      INSTAGRAM_SESSION_ID: ${INSTAGRAM_SESSION_ID:-}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # Resource limits: set in Dokploy's UI per service if needed; leaving them
    # unset avoids cgroup driver differences between hosts.
